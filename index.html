<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exonix — From Strategic Intent to Technical Reality</title>
<meta name="description" content="Exonix. From Strategic Intent to Technical Reality." />
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512x512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=JetBrains+Mono:wght@300;400;500&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f2e8;            /* warm off-white / cream */
    --bg-2: #ece7d8;
    --fg: #15120e;            /* near-black, matches logo X */
    --fg-dim: #5a5448;
    --fg-mute: #a39c8a;
    --line: #e0d9c8;
    --line-bright: #cdc5b1;
    --accent: #4a1a4f;        /* deep aubergine, matches logo E */
    --accent-bright: #6b2d70;
    --accent-deep: #2d0d31;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter Tight', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    position: relative;
    isolation: isolate;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 80px 80px;
    background-position: -1px -1px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, black 25%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, black 25%, transparent 85%);
    z-index: -2;
    pointer-events: none;
    opacity: 0.7;
  }

  /* Subtle purple-tinted vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 110%, rgba(74, 26, 79, 0.07), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% -20%, rgba(74, 26, 79, 0.03), transparent 60%);
    z-index: -1;
    pointer-events: none;
  }

  /* Grain overlay */
  .grain {
    position: fixed;
    inset: 0;
    opacity: 0.12;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 100;
  }

  /* Layout */
  .frame {
    position: relative;
    min-height: 100vh;
    padding: 32px 48px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 48px;
  }

  /* Corner brackets */
  .bracket {
    position: fixed;
    width: 24px;
    height: 24px;
    border-color: var(--fg-dim);
    z-index: 10;
    opacity: 0;
    animation: fadeIn 1.2s 0.2s forwards;
  }
  .bracket.tl { top: 24px; left: 24px; border-top: 1px solid; border-left: 1px solid; }
  .bracket.tr { top: 24px; right: 24px; border-top: 1px solid; border-right: 1px solid; }
  .bracket.bl { bottom: 24px; left: 24px; border-bottom: 1px solid; border-left: 1px solid; }
  .bracket.br { bottom: 24px; right: 24px; border-bottom: 1px solid; border-right: 1px solid; }

  /* Top bar */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg-dim);
    opacity: 0;
    animation: slideDown 1s 0.4s forwards;
  }

  .mark {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .mark-text {
    color: var(--fg);
    letter-spacing: 0.32em;
    font-weight: 500;
  }

  .topbar .coord { color: var(--fg-mute); }

  .status {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(74, 26, 79, 0.5);
    animation: pulse 2.2s ease-in-out infinite;
  }

  /* Hero */
  .hero {
    align-self: center;
    display: grid;
    gap: 56px;
    justify-items: center;
    text-align: center;
    padding: 24px 0;
  }

  .meta-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 16px;
    opacity: 0;
    animation: fadeIn 1s 0.7s forwards;
  }

  .meta-line::before, .meta-line::after {
    content: '';
    width: 36px;
    height: 1px;
    background: var(--accent);
    opacity: 0.5;
  }

  /* Logo */
  .logo-wrap {
    width: min(620px, 88vw);
    opacity: 0;
    transform: translateY(16px);
    animation: logoIn 1.3s 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .logo-wrap img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Tagline */
  .tagline {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(20px, 2.4vw, 30px);
    color: var(--fg-dim);
    letter-spacing: -0.005em;
    max-width: 680px;
    line-height: 1.4;
    opacity: 0;
    animation: fadeIn 1.4s 1.6s forwards;
  }

  .tagline .em {
    color: var(--fg);
    font-style: italic;
  }

  .tagline-sep {
    display: inline-block;
    width: 28px;
    height: 1px;
    background: var(--accent);
    vertical-align: middle;
    margin: 0 12px 6px;
  }

  /* Footer */
  .footer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-mute);
    opacity: 0;
    animation: slideUp 1s 2s forwards;
  }

  .footer-left, .footer-right {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .footer-right { text-align: right; align-items: flex-end; }

  .footer .label { color: var(--fg-mute); }
  .footer .value { color: var(--fg-dim); }

  .footer-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .progress {
    width: 180px;
    height: 1px;
    background: var(--line-bright);
    position: relative;
    overflow: hidden;
  }
  .progress::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: scan 3.5s ease-in-out infinite;
  }

  .footer-center .phase {
    color: var(--fg-dim);
  }
  .footer-center .phase .accent { color: var(--accent); }

  /* Mobile */
  @media (max-width: 768px) {
    .frame { padding: 24px 20px; gap: 32px; }
    .bracket { width: 16px; height: 16px; }
    .bracket.tl, .bracket.tr { top: 16px; }
    .bracket.bl, .bracket.br { bottom: 16px; }
    .bracket.tl, .bracket.bl { left: 16px; }
    .bracket.tr, .bracket.br { right: 16px; }
    .topbar .coord { display: none; }
    .meta-line::before, .meta-line::after { width: 18px; }
    .tagline-sep { display: block; margin: 10px auto; }
    .footer { grid-template-columns: 1fr; gap: 18px; text-align: center; }
    .footer-left, .footer-right { align-items: center; text-align: center; }
    .footer-right { text-align: center; }
    .hero { gap: 36px; }
    body::before { background-size: 48px 48px; }
  }

  /* Animations */
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes logoIn {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }
  @keyframes scan {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  ::selection {
    background: var(--accent);
    color: var(--bg);
  }
</style>
</head>
<body>

<!-- Grain overlay -->
<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="n">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0 0.18  0 0 0 0.5 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>

<!-- Corner brackets -->
<span class="bracket tl"></span>
<span class="bracket tr"></span>
<span class="bracket bl"></span>
<span class="bracket br"></span>

<div class="frame">

  <!-- Top bar -->
  <header class="topbar">
    <div class="mark">
      <span class="mark-text">Exonix</span>
      <span class="coord">/ index 001</span>
    </div>
    <div class="status">
      <span class="status-dot"></span>
    </div>
  </header>

  <!-- Hero -->
  <main class="hero">

    <div class="meta-line">
      Arriving 2026
    </div>

    <div class="logo-wrap">
      <img src="exonix-logo.png" alt="Exonix" />
    </div>

    <p class="tagline">
      From <span class="em">strategic intent</span>
      <span class="tagline-sep"></span>
      to <span class="em">technical reality.</span>
    </p>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-left">
      <div><span class="label">Sector</span> <span class="value">/ Strategy · Operations</span></div>
    </div>
    <div class="footer-center">
      <div class="progress"></div>
      <div class="phase">
        Phase <span class="accent">02</span> / Pre-Launch
      </div>
    </div>
    <div class="footer-right">
      <div><span class="label">© 2026</span> <span class="value">/ Exonix LLC</span></div>
    </div>
  </footer>

</div>

</body>
</html>
