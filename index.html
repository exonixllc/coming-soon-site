<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exonix — From Strategic Intent to Tactical Reality</title>
<meta name="description" content="Exonix. From Strategic Intent to Tactical Reality. Deployment in progress." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=JetBrains+Mono:wght@300;400;500&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0a08;
    --bg-2: #14110d;
    --fg: #f0ebe0;
    --fg-dim: #a39d8e;
    --fg-mute: #5a5447;
    --line: #1f1c16;
    --line-bright: #322d23;
    --accent: #e8a13c;
    --accent-bright: #ffc16b;
    --accent-deep: #b87715;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter Tight', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    position: relative;
    isolation: isolate;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 80px 80px;
    background-position: -1px -1px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, black 30%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, black 30%, transparent 85%);
    z-index: -2;
    pointer-events: none;
  }

  /* Warm vignette + grain */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 110%, rgba(232, 161, 60, 0.08), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% -20%, rgba(232, 161, 60, 0.04), transparent 60%);
    z-index: -1;
    pointer-events: none;
  }

  /* SVG noise overlay */
  .grain {
    position: fixed;
    inset: 0;
    opacity: 0.08;
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 100;
  }

  /* Layout */
  .frame {
    position: relative;
    min-height: 100vh;
    padding: 32px 48px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 48px;
  }

  /* Corner brackets */
  .bracket {
    position: fixed;
    width: 24px;
    height: 24px;
    border-color: var(--fg-mute);
    z-index: 10;
    opacity: 0;
    animation: fadeIn 1.2s 0.2s forwards;
  }
  .bracket.tl { top: 24px; left: 24px; border-top: 1px solid; border-left: 1px solid; }
  .bracket.tr { top: 24px; right: 24px; border-top: 1px solid; border-right: 1px solid; }
  .bracket.bl { bottom: 24px; left: 24px; border-bottom: 1px solid; border-left: 1px solid; }
  .bracket.br { bottom: 24px; right: 24px; border-bottom: 1px solid; border-right: 1px solid; }

  /* Top bar */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg-dim);
    opacity: 0;
    animation: slideDown 1s 0.4s forwards;
  }

  .mark {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .mark-glyph {
    width: 14px;
    height: 14px;
    position: relative;
  }

  .mark-glyph svg {
    width: 100%;
    height: 100%;
    animation: rotate 22s linear infinite;
  }

  .mark-text {
    color: var(--fg);
    letter-spacing: 0.28em;
    font-weight: 500;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2.2s ease-in-out infinite;
  }

  .topbar .coord { color: var(--fg-mute); }

  /* Hero */
  .hero {
    align-self: center;
    display: grid;
    gap: 56px;
    text-align: center;
    padding: 24px 0;
  }

  .meta-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    opacity: 0;
    animation: fadeIn 1s 0.7s forwards;
  }

  .meta-line::before, .meta-line::after {
    content: '';
    width: 36px;
    height: 1px;
    background: var(--accent-deep);
  }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(72px, 16vw, 240px);
    line-height: 0.88;
    letter-spacing: -0.04em;
    color: var(--fg);
    font-variation-settings: "opsz" 144, "SOFT" 100;
    position: relative;
    display: inline-block;
  }

  .wordmark .letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(20px);
    animation: letterRise 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .wordmark .letter:nth-child(1) { animation-delay: 0.55s; }
  .wordmark .letter:nth-child(2) { animation-delay: 0.62s; }
  .wordmark .letter:nth-child(3) { animation-delay: 0.69s; }
  .wordmark .letter:nth-child(4) { animation-delay: 0.76s; }
  .wordmark .letter:nth-child(5) { animation-delay: 0.83s; }
  .wordmark .letter:nth-child(6) { animation-delay: 0.90s; }

  .wordmark .letter.x {
    color: var(--accent);
    font-style: italic;
    font-weight: 400;
  }

  .tagline {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(18px, 2.2vw, 26px);
    color: var(--fg-dim);
    letter-spacing: -0.005em;
    max-width: 640px;
    margin: 0 auto;
    line-height: 1.4;
    opacity: 0;
    animation: fadeIn 1.4s 1.4s forwards;
  }

  .tagline .em {
    color: var(--fg);
    font-style: italic;
  }

  .tagline-sep {
    display: inline-block;
    width: 28px;
    height: 1px;
    background: var(--accent);
    vertical-align: middle;
    margin: 0 12px 6px;
  }

  /* Email capture */
  .access {
    display: grid;
    gap: 14px;
    max-width: 460px;
    margin: 18px auto 0;
    opacity: 0;
    animation: fadeIn 1.2s 1.7s forwards;
  }

  .access-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--fg-mute);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .access-form {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--line-bright);
    background: rgba(20, 17, 13, 0.5);
    backdrop-filter: blur(8px);
    transition: border-color 0.3s ease;
  }

  .access-form:focus-within {
    border-color: var(--accent-deep);
  }

  .access-form input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    padding: 16px 18px;
  }

  .access-form input::placeholder {
    color: var(--fg-mute);
    font-style: italic;
  }

  .access-form button {
    background: transparent;
    border: none;
    border-left: 1px solid var(--line-bright);
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 0 22px;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .access-form button:hover {
    background: var(--accent);
    color: var(--bg);
  }

  .access-form button .arrow {
    transition: transform 0.25s ease;
  }
  .access-form button:hover .arrow {
    transform: translateX(3px);
  }

  /* Footer */
  .footer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-mute);
    opacity: 0;
    animation: slideUp 1s 1.9s forwards;
  }

  .footer-left, .footer-right {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .footer-right { text-align: right; align-items: flex-end; }

  .footer .label { color: var(--fg-mute); }
  .footer .value { color: var(--fg-dim); }

  .footer-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .progress {
    width: 180px;
    height: 1px;
    background: var(--line-bright);
    position: relative;
    overflow: hidden;
  }
  .progress::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: scan 3.5s ease-in-out infinite;
  }

  .footer-center .phase {
    color: var(--fg-dim);
  }
  .footer-center .phase .accent { color: var(--accent); }

  /* Mobile */
  @media (max-width: 768px) {
    .frame { padding: 24px 20px; gap: 32px; }
    .bracket { width: 16px; height: 16px; }
    .bracket.tl, .bracket.tr { top: 16px; }
    .bracket.bl, .bracket.br { bottom: 16px; }
    .bracket.tl, .bracket.bl { left: 16px; }
    .bracket.tr, .bracket.br { right: 16px; }
    .topbar .coord { display: none; }
    .meta-line::before, .meta-line::after { width: 18px; }
    .tagline-sep { display: block; margin: 10px auto; }
    .footer { grid-template-columns: 1fr; gap: 18px; text-align: center; }
    .footer-left, .footer-right { align-items: center; text-align: center; }
    .footer-right { text-align: center; }
    .hero { gap: 36px; }
    body::before { background-size: 48px 48px; }
  }

  /* Animations */
  @keyframes fadeIn {
    to { opacity: 1; }
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes letterRise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }
  @keyframes rotate {
    to { transform: rotate(360deg); }
  }
  @keyframes scan {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* Selection */
  ::selection {
    background: var(--accent);
    color: var(--bg);
  }
</style>
</head>
<body>

<!-- Grain overlay -->
<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="n">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.9  0 0 0 0 0.7  0 0 0 0 0.4  0 0 0 0.6 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>

<!-- Corner brackets -->
<span class="bracket tl"></span>
<span class="bracket tr"></span>
<span class="bracket bl"></span>
<span class="bracket br"></span>

<div class="frame">

  <!-- Top bar -->
  <header class="topbar">
    <div class="mark">
      <span class="mark-glyph">
        <svg viewBox="0 0 14 14" fill="none">
          <circle cx="7" cy="7" r="6" stroke="#e8a13c" stroke-width="1"/>
          <path d="M7 1 L7 13 M1 7 L13 7" stroke="#e8a13c" stroke-width="0.6"/>
          <circle cx="7" cy="7" r="1.5" fill="#e8a13c"/>
        </svg>
      </span>
      <span class="mark-text">Exonix</span>
      <span class="coord">/ index 001</span>
    </div>
    <div class="status">
      <span class="status-dot"></span>
    </div>
  </header>

  <!-- Hero -->
  <main class="hero">

    <div class="meta-line">
      Arriving 2026 · Confidential Access
    </div>

    <h1 class="wordmark" aria-label="Exonix">
      <span class="letter">E</span><span class="letter x">X</span><span class="letter">O</span><span class="letter">N</span><span class="letter">I</span><span class="letter">X</span>
    </h1>

    <p class="tagline">
      From <span class="em">strategic intent</span>
      <span class="tagline-sep"></span>
      to <span class="em">tactical reality.</span>
    </p>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-left">
      <div><span class="label">Sector</span> <span class="value">/ Strategy · Operations</span></div>
    </div>
    <div class="footer-center">
      <div class="progress"></div>
      <div class="phase">
        Phase <span class="accent">02</span> / Pre-Launch
      </div>
    </div>
    <div class="footer-right">
      <div><span class="label">© 2026</span> <span class="value">/ Exonix LLC</span></div>
    </div>
  </footer>

</div>

<script>
  // Intentionally left minimal — animations are CSS-driven.
</script>

</body>
</html>
